<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta de Empresas</title>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--ink:#1c2430;--muted:#667385;--line:#dde3ea;
  --accent:#0f6b5c;--accent-soft:#e3f2ef;--warn:#9a5b00;--warn-soft:#fff3df;--off:#b42318;--off-soft:#fbeaea;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161b;--card:#1b2128;--ink:#e6ebf0;--muted:#97a3b2;--line:#2c343e;
  --accent:#4fc1a9;--accent-soft:#173a33;--warn:#e7b25c;--warn-soft:#3a2e17;--off:#f08a8a;--off-soft:#3a1f1f;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.deps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.dep{font:inherit;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px}
.dep:hover{color:var(--ink)}
.dep[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dep[aria-pressed="true"]{color:#0b1512}}
.dep .n{font-weight:500;opacity:.75;margin-left:4px;font-size:12px}
.search{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0 12px}
.box{display:flex;gap:8px;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
input{flex:1 1 320px;font-size:17px}
input:focus,select:focus,.dep:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select{flex:0 1 auto}
.count{color:var(--muted);font-size:13px;margin-top:8px}
.list{display:grid;gap:10px;margin-top:6px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.cod{color:var(--muted);font-size:12px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;margin-top:10px}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.val{font-weight:500}
.resp{color:var(--accent);font-weight:700}
.resp.alerta{color:var(--off)}
.cnpj{font-variant-numeric:tabular-nums;cursor:pointer;border-bottom:1px dashed var(--muted)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.sm{background:var(--warn-soft);color:var(--warn)}
.tag.off{background:var(--off-soft);color:var(--off)}
mark{background:#ffe58a;color:#1c2430;border-radius:3px;padding:0 1px}
.empty{color:var(--muted);text-align:center;padding:30px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="titulo">Consulta de Empresas</h1>
  <p class="sub">Escolha o departamento e digite o nome (ou parte), o CNPJ ou o código. Clique no CNPJ para copiar.</p>
  <div class="deps" role="group" aria-label="Departamento" id="deps"></div>
  <div class="search">
    <div class="box">
      <input id="q" type="search" placeholder="Ex.: batataria, 33.348.560, 284…" autocomplete="off" autofocus>
      <select id="fResp"></select>
      <select id="fSit"></select>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div class="list" id="list"></div>
</div>

/* ======================================================================================= */

const DEPS = {
  contabil:{nome:'Departamento Contábil', resp:'Responsável contábil', respTodos:'Todos os responsáveis', dados:DADOS_CONTABIL, regime:true},
  pessoal: {nome:'Departamento Pessoal',  resp:'Atendente DP',         respTodos:'Todas as atendentes',  dados:DADOS_PESSOAL,  regime:false},
  fiscal:  {nome:'Departamento Fiscal',   resp:'Responsável fiscal',   respTodos:'Todos os responsáveis', dados:DADOS_FISCAL,  regime:true},
};
const ALERTA = new Set(['SEM FOLHA DE PAGAMENTO','SEM FISCAL','BAIXADA','SAIU']);

const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const digits = s => (s||'').replace(/\D/g,'');
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
for(const k in DEPS){
  DEPS[k].rows = DEPS[k].dados.map(r=>{const cpf=String(r[2]||'').includes('*');
    return {cod:r[0],nome:r[1],doc:r[2],cpf,resp:r[3],reg:r[4],sit:r[5],n:norm(r[1]),d:cpf?'':digits(r[2])}})
    .sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}

const q=document.getElementById('q'),fResp=document.getElementById('fResp'),fSit=document.getElementById('fSit');
const list=document.getElementById('list'),count=document.getElementById('count'),depsEl=document.getElementById('deps');
let dep='contabil';

depsEl.innerHTML = Object.entries(DEPS).map(([k,v])=>`<button type="button" class="dep" data-k="${k}" aria-pressed="false">${v.nome}<span class="n">${v.rows.length}</span></button>`).join('');
depsEl.addEventListener('click',e=>{const b=e.target.closest('.dep'); if(b) setDep(b.dataset.k,true)});

function setDep(k,push){
  if(!DEPS[k]) k='contabil';
  dep=k; const D=DEPS[k];
  depsEl.querySelectorAll('.dep').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
  document.getElementById('titulo').textContent='Consulta de Empresas — '+D.nome;
  document.title='Consulta de Empresas — '+D.nome;
  fResp.innerHTML=''; fResp.add(new Option(D.respTodos,''));
  [...new Set(D.rows.map(r=>r.resp).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR')).forEach(v=>fResp.add(new Option(v,v)));
  fSit.innerHTML=''; fSit.add(new Option('Todas as situações',''));
  [...new Set(D.rows.map(r=>r.sit||'(sem situação)'))].sort().forEach(v=>fSit.add(new Option(v,v)));
  if(push && location.hash!=='#'+k) history.replaceState(null,'','#'+k);
  render(); q.focus();
}
window.addEventListener('hashchange',()=>setDep(location.hash.slice(1),false));

function hl(text, terms){
  if(!terms.length) return esc(text);
  const t = norm(text); const marks = new Array(text.length).fill(false);
  terms.forEach(term=>{let i=0;while((i=t.indexOf(term,i))>-1){for(let k=i;k<i+term.length;k++)marks[k]=true;i+=term.length;}});
  let out='',open=false;
  for(let i=0;i<text.length;i++){
    if(marks[i]&&!open){out+='<mark>';open=true}
    if(!marks[i]&&open){out+='</mark>';open=false}
    out+=esc(text[i]);
  }
  return out+(open?'</mark>':'');
}
function sitTag(s){
  if(!s) return '<span class="tag sm">—</span>';
  const c = s==='ATIVA'?'':((s==='S/M'||s==='SEM MOVIMENTO')?'sm':'off');
  return `<span class="tag ${c}">${esc(s)}</span>`;
}
function render(){
  const D=DEPS[dep];
  const raw=q.value.trim(), terms=norm(raw).split(/\s+/).filter(Boolean), dq=digits(raw);
  const onlyDigits = raw && /^[\d.\/\-\s]+$/.test(raw);
  let res = D.rows.filter(r=>{
    if(fResp.value && r.resp!==fResp.value) return false;
    if(fSit.value && (r.sit||'(sem situação)')!==fSit.value) return false;
    if(!raw) return true;
    if(onlyDigits) return (r.d && r.d.includes(dq)) || String(r.cod)===dq;
    return terms.every(t=>r.n.includes(t));
  });
  if(terms.length && !onlyDigits){
    const f=terms[0];
    res.sort((a,b)=>(a.n.startsWith(f)?0:1)-(b.n.startsWith(f)?0:1)||a.nome.localeCompare(b.nome,'pt-BR'));
  }
  count.textContent = `${res.length} de ${D.rows.length} empresas · ${D.nome}`;
  if(!res.length){list.innerHTML='<div class="empty">Nenhuma empresa encontrada neste departamento.</div>';return}
  list.innerHTML = res.slice(0,200).map(r=>`
    <div class="item">
      <div class="top"><div class="name">${onlyDigits?esc(r.nome):hl(r.nome,terms)}</div><div class="cod">${r.cod!==''&&r.cod!=null?'Cód. '+esc(r.cod):''}</div></div>
      <div class="grid">
        <div><div class="lab">${r.cpf?'CPF':'CNPJ'}</div><div class="val">${r.cpf||!r.doc?esc(r.doc||'—'):`<span class="cnpj" data-c="${esc(r.doc)}" title="Clique para copiar">${esc(r.doc)}</span>`}</div></div>
        <div><div class="lab">${D.resp}</div><div class="val resp${ALERTA.has(r.resp)?' alerta':''}">${esc(r.resp)||'—'}</div></div>
        ${D.regime?`<div><div class="lab">Regime tributário</div><div class="val">${esc(r.reg)||'—'}</div></div>`:''}
        <div><div class="lab">Situação</div><div class="val">${sitTag(r.sit)}</div></div>
      </div>
    </div>`).join('') + (res.length>200?`<div class="empty">Mostrando 200 de ${res.length}. Refine a busca.</div>`:'');
}
list.addEventListener('click',e=>{
  const el=e.target.closest('.cnpj'); if(!el||!el.dataset.c) return;
  const t=document.getElementById('toast');
  const done=()=>{t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1200)};
  if(navigator.clipboard) navigator.clipboard.writeText(el.dataset.c).then(done).catch(()=>{});
});
[q,fResp,fSit].forEach(el=>el.addEventListener('input',render));
setDep(location.hash.slice(1)||'contabil',false);
</script>
