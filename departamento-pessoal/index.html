<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empresas do Departamento Pessoal</title>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--ink:#1c2430;--muted:#667385;--line:#dde3ea;
  --accent:#0f6b5c;--accent-soft:#e3f2ef;--warn:#9a5b00;--warn-soft:#fff3df;--off:#8a3b3b;--off-soft:#fbeaea;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161b;--card:#1b2128;--ink:#e6ebf0;--muted:#97a3b2;--line:#2c343e;
  --accent:#4fc1a9;--accent-soft:#173a33;--warn:#e7b25c;--warn-soft:#3a2e17;--off:#e48b8b;--off-soft:#3a1f1f;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.search{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0 12px}
.box{display:flex;gap:8px;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
input{flex:1 1 320px;font-size:17px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
select{flex:0 1 auto}
.count{color:var(--muted);font-size:13px;margin-top:8px}
.list{display:grid;gap:10px;margin-top:6px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:600;font-size:16px}
.cod{color:var(--muted);font-size:12px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;margin-top:10px}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.val{font-weight:500}
.resp{color:var(--accent);font-weight:700}
.cnpj{font-variant-numeric:tabular-nums;cursor:pointer;border-bottom:1px dashed var(--muted)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.sm{background:var(--warn-soft);color:var(--warn)}
.tag.off{background:var(--off-soft);color:var(--off)}
mark{background:#ffe58a;color:#1c2430;border-radius:3px;padding:0 1px}
.empty{color:var(--muted);text-align:center;padding:30px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">

      <select id="fSit"><option value="">Todas as situações</option></select>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div class="list" id="list"></div>
</div>

const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const digits = s => (s||'').replace(/\D/g,'');
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rows = DADOS.map(r=>({cod:r[0],nome:r[1],cnpj:r[2],tipo:r[3]||'CNPJ',resp:r[4],sit:r[5],n:norm(r[1]),d:r[3]==='CPF'?'':digits(r[2])}))
  .sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));

const q=document.getElementById('q'),fResp=document.getElementById('fResp'),fSit=document.getElementById('fSit');
const list=document.getElementById('list'),count=document.getElementById('count');
[...new Set(rows.map(r=>r.resp).filter(Boolean))].sort().forEach(v=>fResp.add(new Option(v,v)));
[...new Set(rows.map(r=>r.sit||'(sem situação)'))].sort().forEach(v=>fSit.add(new Option(v,v)));

function hl(text, terms){
  if(!terms.length) return esc(text);
  const t = norm(text); const marks = new Array(text.length).fill(false);
  terms.forEach(term=>{let i=0;while((i=t.indexOf(term,i))>-1){for(let k=i;k<i+term.length;k++)marks[k]=true;i+=term.length;}});
  let out='',open=false;
  for(let i=0;i<text.length;i++){
    if(marks[i]&&!open){out+='<mark>';open=true}
    if(!marks[i]&&open){out+='</mark>';open=false}
    out+=esc(text[i]);
  }
  return out+(open?'</mark>':'');
}
function sitTag(s){
  if(!s) return '<span class="tag sm">—</span>';
  const c = s==='ATIVA'?'':(s==='SEM MOVIMENTO'?'sm':'off');
  return `<span class="tag ${c}">${esc(s)}</span>`;
}
function render(){
  const raw=q.value.trim(), terms=norm(raw).split(/\s+/).filter(Boolean), dq=digits(raw);
  const onlyDigits = raw && /^[\d.\/\-\s]+$/.test(raw);
  let res = rows.filter(r=>{
    if(fResp.value && r.resp!==fResp.value) return false;
    if(fSit.value && (r.sit||'(sem situação)')!==fSit.value) return false;
    if(!raw) return true;
    if(onlyDigits) return r.d.includes(dq) || String(r.cod)===dq;
    return terms.every(t=>r.n.includes(t));
  });
  if(terms.length && !onlyDigits){
    const f=terms[0];
    res.sort((a,b)=>(a.n.startsWith(f)?0:1)-(b.n.startsWith(f)?0:1)||a.nome.localeCompare(b.nome,'pt-BR'));
  }
  count.textContent = `${res.length} de ${rows.length} empresas`;
  if(!res.length){list.innerHTML='<div class="empty">Nenhuma empresa encontrada.</div>';return}
  list.innerHTML = res.slice(0,200).map(r=>`
    <div class="item">
      <div class="top"><div class="name">${onlyDigits?esc(r.nome):hl(r.nome,terms)}</div><div class="cod">${r.cod!==''?'Cód. '+esc(String(r.cod)):''}</div></div>
      <div class="grid">
        <div><div class="lab">${r.tipo}</div><div class="val">${r.tipo==='CPF'?esc(r.cnpj):`<span class="cnpj" data-c="${esc(r.cnpj)}" title="Clique para copiar">${esc(r.cnpj)||'—'}</span>`}</div></div>
        <div><div class="lab">Atendente DP</div><div class="val resp">${esc(r.resp)||'—'}</div></div>
        <div><div class="lab">Situação</div><div class="val">${sitTag(r.sit)}</div></div>
      </div>
    </div>`).join('') + (res.length>200?`<div class="empty">Mostrando 200 de ${res.length}. Refine a busca.</div>`:'');
}
list.addEventListener('click',e=>{
  const el=e.target.closest('.cnpj'); if(!el||!el.dataset.c) return;
  const t=document.getElementById('toast');
  const done=()=>{t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1200)};
  if(navigator.clipboard) navigator.clipboard.writeText(el.dataset.c).then(done).catch(()=>{});
});
[q,fResp,fSit].forEach(el=>el.addEventListener('input',render));
render();
</script>
